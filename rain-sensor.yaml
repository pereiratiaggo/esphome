esphome:
  name: rain-sensor
  friendly_name: Rain-Sensor
  min_version: 2024.11.0
  name_add_mac_suffix: false

esp8266:
  board: esp01_1m
  
api:

ota:
  - platform: esphome
  - platform: web_server

wifi:
  #ssid: !secret wifi_ssid
  #password: !secret wifi_password
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
    priority: 0.0
  #- ssid: !secret wifi2_ssid
  #  password: !secret wifi2_password
  #  priority: 1.0
  #- ssid: !secret wifi3_ssid
  #  password: !secret wifi3_password
  #  priority: 2.0

  ap:
    ssid: "EspHome-RainSensor"
    password: "12345678"

web_server:
  port: 80
  version: 3

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO2
      mode: INPUT_PULLUP
      inverted: true
    name: "Rain Sensor"
